name: flowdocker-erequest-dev
services:
  temporal-volume-init:
    image: temporalio/temporal:1.4.1@sha256:9844298258519ebece82b3253f1ee1fc4eb8d87b7abcc264cfb676be342c74a5
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data"]
    volumes:
      - flowdocker_temporal:/data
  temporal:
    image: temporalio/temporal:1.4.1@sha256:9844298258519ebece82b3253f1ee1fc4eb8d87b7abcc264cfb676be342c74a5
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - flowdocker_temporal:/data
    depends_on:
      temporal-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: flowdocker
      POSTGRES_USER: fd_migrator
      POSTGRES_PASSWORD: ${FD_DB_PASSWORD:?Run npm run backend:setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - flowdocker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fd_migrator -d flowdocker"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  flowdocker_pg:
  flowdocker_temporal:
